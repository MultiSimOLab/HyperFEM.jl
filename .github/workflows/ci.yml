name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: # needed to allow julia-actions/cache to delete old caches that it has created
  actions: write
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ['min', '1', 'pre'] # min = lowest Julia allowed by [compat] (1.12)
        arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Clone HyperFEMKernels next to HyperFEM (kernel backend of the simulation tests)
        run: git clone --depth 1 https://github.com/MultiSimOLab/HyperFEMKernels.jl ../HyperFEMKernels.jl
      - name: Run tests with both backends (HyperFEMKernels, not registered, developed in the test environment)
        shell: julia --color=yes --check-bounds=yes --project=test {0}
        run: |
          using Pkg
          Pkg.develop([PackageSpec(path="."), PackageSpec(path="../HyperFEMKernels.jl")])
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "runtests.jl"))

  lowest-gridap: # downgrade compatibility: the lowest Gridap allowed by [compat] must still work
    name: Lowest Gridap
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'min' # lowest Julia allowed by [compat]
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Pin Gridap to the lowest version allowed by Project.toml
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg, TOML
          Pkg.Registry.add("General") # not installed yet on a fresh runner (no-op if cached)
          spec = TOML.parsefile("Project.toml")["compat"]["Gridap"]
          ranges = Pkg.Versions.semver_spec(spec).ranges
          lowest = minimum(VersionNumber(r.lower.t...) for r in ranges)
          println("Gridap compat \"$spec\" -> pinning to =$lowest")
          Pkg.compat("Gridap", "=$lowest")
          Pkg.resolve() # fail here if the lower bound is not installable
      - name: Clone HyperFEMKernels next to HyperFEM (kernel backend of the simulation tests)
        run: git clone --depth 1 https://github.com/MultiSimOLab/HyperFEMKernels.jl ../HyperFEMKernels.jl
      - name: Run tests with both backends (HyperFEMKernels, not registered, developed in the test environment)
        shell: julia --color=yes --check-bounds=yes --project=test {0}
        run: |
          using Pkg, TOML
          Pkg.develop([PackageSpec(path="."), PackageSpec(path="../HyperFEMKernels.jl")])
          Pkg.compat("Gridap", TOML.parsefile("Project.toml")["compat"]["Gridap"])
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "runtests.jl"))
